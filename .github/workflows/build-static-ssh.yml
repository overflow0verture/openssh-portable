name: Build static SSH binaries

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  linux-static:
    name: Linux (musl, static)
    runs-on: ubuntu-latest
    container:
      image: alpine:3.20

    steps:
      - name: Install build tools
        run: |
          apk add --no-cache \
            bash \
            git \
            file \
            coreutils \
            build-base \
            linux-headers \
            autoconf \
            automake \
            libtool \
            pkgconfig \
            openssl-dev \
            openssl-libs-static \
            zlib-dev \
            zlib-static

      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate configure
        run: autoreconf -fi

      - name: Configure
        env:
          CFLAGS: -O2 -pipe
          LDFLAGS: -static
        run: |
          ./configure \
            --without-pam \
            --without-selinux \
            --without-kerberos5 \
            --without-libedit \
            --disable-security-key \
            --disable-strip

      - name: Build selected client binaries
        run: make -j"$(getconf _NPROCESSORS_ONLN || echo 2)" ssh scp sftp ssh-keygen ssh-keyscan

      - name: Verify static linkage
        run: |
          for bin in ssh scp sftp ssh-keygen ssh-keyscan; do
            echo "=== $bin ==="
            file "$bin"
            if ldd "$bin" 2>/dev/null; then
              echo "$bin is not fully static"
              exit 1
            fi
          done

      - name: Package artifacts
        run: |
          mkdir -p dist/linux-static
          cp ssh scp sftp ssh-keygen ssh-keyscan dist/linux-static/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssh-linux-static
          path: dist/linux-static/

      - name: Upload failure logs (Linux)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-static-logs
          path: |
            config.log
            **/*.log

  windows-cygwin:
    name: Windows (Cygwin, supported upstream)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Cygwin and deps
        uses: cygwin/cygwin-install-action@v4
        with:
          packages: >-
            autoconf
            automake
            binutils
            gcc-core
            gcc-g++
            libtool
            make
            openssl-devel
            zlib-devel
            pkg-config
            file

      - name: Regenerate configure
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -eo pipefail {0}
        run: autoreconf -fi

      - name: Configure
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -eo pipefail {0}
        env:
          CFLAGS: -O2 -pipe
          LDFLAGS: -static
        run: |
          ./configure \
            --without-pam \
            --without-kerberos5 \
            --without-libedit \
            --disable-security-key \
            --disable-strip

      - name: Build selected client binaries
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -eo pipefail {0}
        run: make -j"$(getconf _NPROCESSORS_ONLN || echo 2)" ssh scp sftp ssh-keygen ssh-keyscan

      - name: Package artifacts
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -eo pipefail {0}
        run: |
          mkdir -p dist/windows-cygwin
          cp ssh.exe scp.exe sftp.exe ssh-keygen.exe ssh-keyscan.exe dist/windows-cygwin/
          file dist/windows-cygwin/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssh-windows-cygwin
          path: dist/windows-cygwin/

      - name: Upload failure logs (Windows)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cygwin-logs
          path: |
            config.log
            **/*.log
