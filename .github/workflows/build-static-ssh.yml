name: Build fully static SSH binaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  linux-static:
    name: Linux (musl, static)
    runs-on: ubuntu-latest
    container:
      image: alpine:3.20

    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache \
            bash \
            build-base \
            linux-headers \
            autoconf \
            automake \
            libtool \
            pkgconfig \
            zlib-static \
            openssl-libs-static \
            openssl-dev \
            zlib-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          autoreconf
          CFLAGS="-O2 -pipe" \
          LDFLAGS="-static" \
          ./configure \
            --without-pam \
            --without-selinux \
            --without-kerberos5 \
            --without-libedit \
            --without-security-key-builtin \
            --disable-strip

      - name: Build
        run: make -j"$(nproc)"

      - name: Package artifacts
        run: |
          mkdir -p dist/linux-static
          cp ssh scp sftp ssh-keygen ssh-keyscan dist/linux-static/
          file dist/linux-static/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssh-linux-static
          path: dist/linux-static/

  windows-static:
    name: Windows (mingw-w64, static)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            autoconf
            automake
            libtool
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-pkgconf

      - name: Configure
        run: |
          autoreconf
          export CC=x86_64-w64-mingw32-gcc
          export AR=x86_64-w64-mingw32-ar
          export RANLIB=x86_64-w64-mingw32-ranlib
          export CFLAGS="-O2 -pipe"
          export LDFLAGS="-static -static-libgcc"

          ./configure \
            --host=x86_64-w64-mingw32 \
            --without-zlib-version-check \
            --without-pam \
            --without-kerberos5 \
            --without-libedit \
            --without-security-key-builtin \
            --disable-strip

      - name: Build
        run: make -j"$(nproc)"

      - name: Package artifacts
        run: |
          mkdir -p dist/windows-static
          cp ssh.exe scp.exe sftp.exe ssh-keygen.exe ssh-keyscan.exe dist/windows-static/
          file dist/windows-static/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssh-windows-static
          path: dist/windows-static/
